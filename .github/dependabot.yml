# Dependabot: wöchentliche, gruppierte Dependency-Updates für npm,
# GitHub Actions und die Docker-Basis-Images. Gruppierung reduziert PR-Lärm
# für die Ehrenamtlichen, die das Projekt warten.
version: 2
# docker-compose läuft bei GitHub noch als Beta-Ecosystem – ohne dieses Flag
# würde der entsprechende Block still ignoriert.
enable-beta-ecosystems: true
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 5
    # Majors, die eine geplante Migration brauchen – nicht per Bump lösbar:
    # - Prisma 7: neues prisma.config.ts, geänderte Client-Generierung
    # - @vitejs/plugin-react 6 + Vite 8: Rolldown-Umstieg, Tailwind-Plugin prüfen
    # - otplib 13: komplette API-Neuschreibung (authenticator.* fällt weg).
    #   Der frühere Blocker (Jest im CJS-Modus konnte die ESM-only-Deps nicht
    #   laden) ist seit dem ESM-Testlauf weg – es bleibt die API-Migration in
    #   totp.service.ts, die bewusst geplant werden will (2FA-kritisch).
    # - @types/node: muss zur Laufzeit passen, und die ist Node 22
    #   (Dockerfiles + CI). Erst zusammen mit einem Node-Upgrade anheben.
    # - TypeScript 6/7: beide Wege sind aktuell zu. TS 6 kommt mit den von
    #   Prisma 6.19 erzeugten Client-Typen nicht zurecht (hunderte Fehler bis
    #   hin zu "hat kein exportiertes Mitglied 'SkillLevel'"), TS 7 baut zwar
    #   sauber durch, aber typescript-eslint 8 bricht dort hart ab
    #   ("does not support TS 7.0"). Wieder aufgreifen, wenn typescript-eslint
    #   TS 7 unterstützt – dann zusammen mit dem Prisma-7-Upgrade und dem
    #   Wechsel von moduleResolution "Node"/node10 auf Node16, den TS 7
    #   ohnehin erzwingt.
    ignore:
      - dependency-name: prisma
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: otplib
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

  # Basis-Images der Dockerfiles (node, caddy). Ohne diesen Block merkt man
  # veraltete Images nur indirekt über rote Trivy-Scans – und dann ist die
  # Pipeline schon blockiert. Gewollt sind hier vor allem Rebuilds derselben
  # Major-Linie, weil die die Upstream-Sicherheitsfixes mitbringen.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ['*']
    # Ein Node-Major ist ein Laufzeitwechsel, kein Bump: engines, die
    # CI-Matrix, @types/node und die README hängen alle an derselben
    # Version. Das gehört zusammen geplant, nicht per Image-Zeile.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # Images aus den Compose-Dateien (postgres, redis, mailpit). Majors bleiben
  # aussen vor: ein Postgres-Major braucht eine geplante Datenmigration.
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    groups:
      compose-images:
        patterns: ['*']
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
